substitutions:
  name: "bluetooth-proxy"
  friendly_name: "Bluetooth Proxy"

esphome:
  min_version: 2026.7.0
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: SmartHomeGuys.Bluetooth Proxy Stick
    version: "2026.10.0"
  name_add_mac_suffix: true
  on_boot:
    priority: 800
    then:
      - output.turn_off: GPIO03   # enable setting the antenna to internal or external. This activates the RF switch control


esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf
    advanced:
      # Add OTA Encryption so firmware files are signed by us (RED EN 18031-1 requirement)
      # signed_ota_verification was added in ESPHome 2026.4.0
      signed_ota_verification:
        signing_key: ota_signing_key.pem
        signing_scheme: rsa3072

# 10 minutes to connect a powered device to wi-fi via BLE after which Wifi & BLE Improv are shutdown on the device.
# You then need to power cycle the device to get another 10 minute window
# This also sets the Api.Encryption.Key when the device first connects to Home Assistant see https://esphome.io/components/provisioning/
# Added for RED EN 18031-1 compliance
# The provisioning section was added in ESPHome 2026.7.0
provisioning:
  timeout: 10min
  on_timeout:
    then:
      - logger.log: "Provisioning window closed. Power-cycle the device to reopen it."


# Enable logging
logger: 
  level: NONE

# Enable Home Assistant API
api:
  encryption:
    # No key is set here, instead it is set during provisioning (by the provisioning section)
    # If a device is later adopted in ESPHome it will then be given a new key.
    # This was hardened in ESPHome 2026.7.0 so during initial device provisioning that connection is encrypted.

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request

http_request:
  verify_ssl: false

wifi:
  power_save_mode: NONE
  output_power: 9.5dB
  
# For configuring Wi-Fi on an ESPHome device by using a serial connection to the device, eg. USB.
improv_serial:

# For configuring Wi-Fi on an ESP32 device by using Bluetooth Low Energy (BLE) to receive the credentials.
esp32_improv:
  authorizer: none

update:
  - platform: http_request
    id: update_http_request
    name: BLE Proxy Firmware
    source: https://smarthomeguys.github.io/Bluetooth-Proxy/manifest-with-encryption.json
    disabled_by_default: false
    update_interval: 6h

dashboard_import:
  package_import_url: github://SmartHomeGuys/Bluetooth-Proxy/bluetooth-proxy.yaml@main
  import_full_config: false
  

# Bluebooth code starts here
# It was based on this repo: https://github.com/esphome/bluetooth-proxies/blob/main/esp32-generic/esp32-generic-c3.yaml
# Default values were used below, copied from the links provided below in case anyone wants to override them

# https://esphome.io/components/esp32_ble_tracker
esp32_ble_tracker:
  scan_parameters:
    active: true      # Using false prevented the Battery Level being read on a Switchbot Outdoor Climate Meter
    continuous: true

    # Had alot of drop offs when using defaults (interval 320ms, window 30ms) and Bermuda integration, these are stable
    interval: 600ms
    window: 600ms

# https://esphome.io/components/bluetooth_proxy.html
bluetooth_proxy:
  active: true
  cache_services: true
  connection_slots: 3

# Bluebooth code ends here

status_led:
  pin:
    number: GPIO15
    inverted: true

output:
  # enables setting the antenna to external or internal. This activates the RF switch control.
  - platform: gpio
    id: "GPIO03"
    pin: GPIO03
